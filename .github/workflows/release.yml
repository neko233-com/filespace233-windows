name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example 0.1.0
        required: true
        default: 0.1.0
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0 --add-source https://api.nuget.org/v3/index.json
          wix eula accept wix7

      - name: Build x64 and arm64 MSI packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          dotnet restore
          ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Validate release artifacts
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ReleaseDirectory artifacts/release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: filespace-msi-package-${{ github.sha }}
          path: |
            artifacts/release/*.msi
            artifacts/release/*.sha256
            artifacts/release/latest.json
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/release/*.msi
            artifacts/release/*.sha256
            artifacts/release/latest.json
