name: ci

on:
  push:
  pull_request:

jobs:
  windows-amd64-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Build app
        env:
          CGO_ENABLED: "0"
        run: go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -platform windows/amd64 -skip-installer

      - name: Install WiX 5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          powershell -ExecutionPolicy Bypass -File .\scripts\build-msi.ps1 -SkipAppBuild

      - uses: actions/upload-artifact@v4
        with:
          name: FileSpace233-windows-amd64
          path: |
            dist/FileSpace233-*-x64.msi
            dist/SHA256SUMS.txt
            dist/windows-amd64/FileSpace233.exe
